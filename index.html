<!DOCTYPE html>
<html lang="es">
<head>

    <!-- Tailwind CSS desde CDN -->

    <script>

                extend: {
                    colors: {
                        brand: {
                            yellow: '#FACC15',

        <div class="mb-8 group cursor-pointer">

            ▶ VER EL ÚLTIMO VIDEO
        </a>
    </main>

    <!-- Pie de página -->

        <p class="text-gray-500 text-sm font-medium tracking-widest uppercase">
            🚀 Próximamente: Mercancía Oficial

</html>
