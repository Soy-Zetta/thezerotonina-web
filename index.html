<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheZerotonina - Humor y Aventuras</title>
    <meta name="description" content="El canal oficial de TheZerotonina. Humor, aventuras y la mejor vibra.">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            yellow: '#FACC15',
                            dark: '#0f172a',
                            card: '#1e293b'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-dark text-white min-h-screen flex flex-col justify-between font-sans antialiased selection:bg-brand-yellow selection:text-brand-dark">

    <!-- Encabezado Limpio -->
    <header class="p-6 md:px-12 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <span class="text-xl md:text-2xl font-black tracking-tighter">⚡ THE ZEROTONINA</span>
        </div>
        <!-- Enlaces directos a redes -->
        <div class="flex space-x-4 text-gray-400">
            <a href="TU_LINK_DE_YOUTUBE" target="_blank" class="hover:text-brand-yellow transition">YouTube</a>
            <a href="TU_LINK_DE_INSTAGRAM" target="_blank" class="hover:text-brand-yellow transition">Instagram</a>
        </div>
    </header>

    <!-- Contenido Principal (Hero Section) -->
    <main class="flex-grow flex flex-col items-center justify-center text-center px-4 -mt-10">
        
        <!-- Avatar / Personaje -->
        <div class="mb-6 group">
            <div class="w-40 h-40 md:w-48 md:h-48 mx-auto bg-brand-card rounded-full flex items-center justify-center shadow-[0_0_30px_rgba(0,0,0,0.5)] border-2 border-gray-800">
                <span class="text-6xl md:text-7xl">🎬</span>
            </div>
        </div>

        <!-- Título de Impacto -->
        <h1 class="text-4xl md:text-7xl font-black mb-3 tracking-tight">
            HUMOR Y <span class="text-brand-yellow">AVENTURAS</span>
        </h1>
        
        <!-- Descripción corta -->
        <p class="text-base md:text-xl text-gray-400 mb-8 max-w-xl mx-auto leading-relaxed">
            La dosis exacta de energía y risas que necesitabas. Entra, mira los videos y pasa un buen rato.
        </p>

        <!-- Botón Principal (Call to Action) -->
        <a href="TU_LINK_DE_YOUTUBE" target="_blank" 
           class="bg-brand-yellow text-brand-dark font-black text-lg md:text-xl py-4 px-10 rounded-full shadow-[0_0_25px_rgba(250,204,21,0.4)] hover:bg-yellow-400 hover:shadow-[0_0_35px_rgba(250,204,21,0.7)] active:scale-95 transition-all duration-300 transform">
            ▶ VER EL CANAL DE YOUTUBE
        </a>
    </main>

    <!-- Footer Minimalista -->
    <footer class="p-6 text-center text-gray-600 text-xs md:text-sm">
        <p>&copy; 2026 TheZerotonina. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
